[project]
name = "studybot"
version = "1.0.0"
description = "AI-powered Study Assistant with RAG, web scraping, and flashcard generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.18",
    "groq>=0.13.0",
    "langchain>=0.3.17",
    "langchain-core>=0.3.33",
    "langchain-voyageai>=0.3.2",
    "voyageai>=0.3.7",
    "pymongo>=4.11",
    "pymupdf>=1.25.3",
    "pytesseract>=0.3.13",
    "python-dotenv>=1.0.1",
    "crawl4ai>=0.4.248",
    "httpx>=0.28.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
]
